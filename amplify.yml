version: 1
# AWS Amplify Hosting build spec — builds the marketing site as a PURE STATIC
# export (`out/`) and serves it from CloudFront. No SSR / no Lambda → the
# Cloudflare Free-plan 10ms-CPU cap that caused Error 1102 cannot exist here.
#
# STATIC_EXPORT=true flips next.config.ts to `output: "export"` (see that file).
# Node 22 is required by Next 16.
frontend:
  phases:
    preBuild:
      commands:
        # Next 16 needs Node 20.9+ / 22. Install THEN use (robust — `use` alone
        # fails if 22 isn't pre-installed on the build image).
        - nvm install 22 && nvm use 22
        - node -v
        - npm ci
    build:
      commands:
        # Headroom for the webpack build (three.js / WebGL page is memory-heavy)
        # so it can't OOM on the default build instance.
        - STATIC_EXPORT=true NODE_OPTIONS=--max-old-space-size=4096 npm run build
  artifacts:
    # `next build` with output:export writes the static site here.
    baseDirectory: out
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
