# AWS Amplify custom response headers — mirrors the security headers that
# next.config.ts serves on the Cloudflare/OpenNext build. Static export can't run
# next.config `headers()`, so these are applied by Amplify instead.
#
# If Amplify doesn't pick up this file, paste the same rules in the console:
#   Amplify app → Hosting → Custom headers.
customHeaders:
  - pattern: "**"
    headers:
      - key: "Content-Security-Policy"
        value: "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: blob: https:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; style-src-elem 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com; script-src-elem 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com; connect-src 'self' https://www.google-analytics.com https://region1.google-analytics.com https://api.web3forms.com https://labs.shieldsyncsecurity.com; frame-src https://www.youtube.com https://www.youtube-nocookie.com; upgrade-insecure-requests"
      - key: "X-Frame-Options"
        value: "DENY"
      - key: "X-Content-Type-Options"
        value: "nosniff"
      - key: "Referrer-Policy"
        value: "strict-origin-when-cross-origin"
      - key: "Permissions-Policy"
        value: "camera=(), microphone=(), geolocation=(), browsing-topics=()"
      - key: "Strict-Transport-Security"
        value: "max-age=63072000; includeSubDomains; preload"
      # Cap the CDN TTL for pages. Amplify's default is s-maxage=31536000 (a YEAR)
      # relying on deploy-time invalidation — which raced/failed on 2026-07-07
      # (rapid deploys 45-47): CloudFront kept serving the previous build's HTML
      # (old page-chunk hashes) with Age still climbing after a SUCCEED deploy.
      # 5-minute edge TTL bounds any future stale window; browsers still
      # revalidate every time (max-age=0).
      - key: "Cache-Control"
        value: "public, max-age=0, s-maxage=300, must-revalidate"
  # Hashed build assets are immutable by name — cache them hard. This pattern is
  # more specific than "**"; per Amplify semantics the LAST matching rule wins,
  # so keep it BELOW the catch-all. Verify after deploy: pages -> s-maxage=300,
  # chunks -> immutable.
  - pattern: "/_next/static/**"
    headers:
      - key: "Cache-Control"
        value: "public, max-age=31536000, immutable"
