# AWS Amplify custom response headers — mirrors the security headers that
# next.config.ts serves on the Cloudflare/OpenNext build. Static export can't run
# next.config `headers()`, so these are applied by Amplify instead.
#
# If Amplify doesn't pick up this file, paste the same rules in the console:
#   Amplify app → Hosting → Custom headers.
customHeaders:
  - pattern: "**"
    headers:
      - key: "Content-Security-Policy"
        value: "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self' https://formspree.io; img-src 'self' data: blob: https:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com; connect-src 'self' https://www.google-analytics.com https://region1.google-analytics.com https://api.web3forms.com; frame-src https://www.youtube.com https://www.youtube-nocookie.com; upgrade-insecure-requests"
      - key: "X-Frame-Options"
        value: "DENY"
      - key: "X-Content-Type-Options"
        value: "nosniff"
      - key: "Referrer-Policy"
        value: "strict-origin-when-cross-origin"
      - key: "Permissions-Policy"
        value: "camera=(), microphone=(), geolocation=(), browsing-topics=()"
      - key: "Strict-Transport-Security"
        value: "max-age=63072000; includeSubDomains; preload"
